[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-blindspot"
version = "0.1.0"
description = "Find what a project's CI structurally cannot catch — Windows privilege and platform gaps."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "iam-kira" }]
keywords = ["ci", "windows", "symlink", "cross-platform", "testing", "pytest", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/iam-kira/ci-blindspot"
Issues = "https://github.com/iam-kira/ci-blindspot/issues"

[project.scripts]
ci-blindspot = "ci_blindspot:main"

[tool.setuptools]
py-modules = ["ci_blindspot"]
